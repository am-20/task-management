<!--
  Hearth password reset email.
  Paste into Supabase → Authentication → Emails → Templates → Reset Password (the "Source" view).
  Subject: Reset your Hearth password
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#15100d;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#211915;border:1px solid #31261f;border-radius:18px;">
        <tr>
          <td align="center" style="padding:36px 32px 8px;">
            <img src="https://hearth-app.dev/icons/icon-192.png" width="56" height="56" alt="" style="display:block;border-radius:14px;" />
            <div style="margin-top:14px;font-family:Georgia,'Times New Roman',serif;font-size:26px;color:#f1e7da;">Hearth</div>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 8px;color:#bcab9b;font-size:15px;line-height:1.55;text-align:center;">
            Someone asked to reset the password for your Hearth account.
            If it was you, choose a new one below.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:20px 32px 12px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8b0000;color:#fff5ec;text-decoration:none;font-size:15px;font-weight:600;padding:13px 26px;border-radius:11px;">Choose a new password</a>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 32px;color:#8f7f72;font-size:13px;line-height:1.5;text-align:center;">
            The link works once and expires within an hour.<br />
            Didn't ask for this? Ignore this email and nothing will change.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
